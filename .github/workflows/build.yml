name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Build unsigned IPA
        run: |
          chmod +x ./ipabuild.sh
          ./ipabuild.sh

      - name: Collect artifacts
        run: |
          ls -lh ./*.ipa
          shasum -a 256 ./*.ipa | tee ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dirtyZero
          path: |
            dirtyZero.ipa
            ipa.sha256
          if-no-files-found: error
